<mat-toolbar class="justify-between shrink-0 mat-bg-surface-container-low relative">
  <div class="flex flex-row justify-between mx-auto min-w-[280px] w-full max-w-[1080px]">
    <div class="start flex flex-row items-center gap-[8px]">
      <div class="calc grid grid-rows-[6px_1fr] gap-[2px] mat-bg-secondary-container box-border rounded-[4px] size-[24px] p-[3px]">
        <div class="screen"></div>
        <div class="pad grid grid-cols-4 gap-[2px]">
          <i class="key"></i><i class="key"></i><i class="key"></i><i class="key op"></i>
          <i class="key"></i><i class="key"></i><i class="key"></i><i class="key op"></i>
          <i class="key"></i><i class="key"></i><i class="key"></i><i class="key op"></i>
          <i class="key"></i><i class="key op"></i><i class="key op"></i><i class="key op"></i>
        </div>
      </div>

      <span
        class="mat-font-headline-md cursor-pointer select-none mat-text-on-surface"
        routerLink="/"
      >
        {{ 'toolbar.deposit_calculator' | translate }}
      </span>
    </div>

    <div class="flex flex-row gap-[8px] end">
      <button matIconButton (click)="openPreferences()">
        <mat-icon>user_attributes</mat-icon>
      </button>
    </div>
  </div>

</mat-toolbar>

<main class="mx-auto p-[16px_16px_24px] grow min-w-[280px] w-full max-w-[1080px]">
  <router-outlet></router-outlet>
</main>

<footer class="mat-bg-surface-container-low w-full flex flex-col items-center mt-[80px] py-[28px]">
  <div class="flex flex-row justify-between items-center p-[0px_16px] min-w-[280px] w-full max-w-[1080px]">
    <div class="flex flex-row flex-wrap md:flex-nowrap items-center gap-[8px]">
      <a
        matButton
        [href]="linkedInUrl"
        target="_blank" referrerpolicy="no-referrer"
      >
        <mat-icon class="mat-text-on-surface-variant">
          <svg
            class="size-[100%] box-content fill-current"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 72 82"
          >
            <g fill="none" fill-rule="evenodd">
              <path d="M8,72 L64,72 C68.418278,72 72,68.418278 72,64 L72,8 C72,3.581722 68.418278,-8.11624501e-16 64,0 L8,0 C3.581722,8.11624501e-16 -5.41083001e-16,3.581722 0,8 L0,64 C5.41083001e-16,68.418278 3.581722,72 8,72 Z" />
              <path d="M62,62 L51.315625,62 L51.315625,43.8021149 C51.315625,38.8127542 49.4197917,36.0245323 45.4707031,36.0245323 C41.1746094,36.0245323 38.9300781,38.9261103 38.9300781,43.8021149 L38.9300781,62 L28.6333333,62 L28.6333333,27.3333333 L38.9300781,27.3333333 L38.9300781,32.0029283 C38.9300781,32.0029283 42.0260417,26.2742151 49.3825521,26.2742151 C56.7356771,26.2742151 62,30.7644705 62,40.051212 L62,62 Z M16.349349,22.7940133 C12.8420573,22.7940133 10,19.9296567 10,16.3970067 C10,12.8643566 12.8420573,10 16.349349,10 C19.8566406,10 22.6970052,12.8643566 22.6970052,16.3970067 C22.6970052,19.9296567 19.8566406,22.7940133 16.349349,22.7940133 Z M11.0325521,62 L21.769401,62 L21.769401,27.3333333 L11.0325521,27.3333333 L11.0325521,62 Z" fill="currentColor" />
            </g>
          </svg>
        </mat-icon>
        <span class="mat-text-on-surface-variant">LinkedIn</span>
      </a>

      <a mat-button [href]="githubUrl" target="_blank" referrerpolicy="no-referrer">
        <mat-icon class="mat-text-on-surface-variant">
          <svg
            width="18"
            height="18"
            class="size-[80%] box-content fill-current"
            xmlns="http://www.w3.org/2000/svg"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            id="Layer_1"
            viewBox="-5 -14 64 64"
          >
            <path  d="M25.9,0.2C11.8,0.2,0.3,11.7,0.3,25.8c0,11.3,7.3,20.9,17.5,24.3c1.3,0.2,1.7-0.6,1.7-1.2c0-0.6,0-2.6,0-4.8 c-7.1,1.5-8.6-3-8.6-3c-1.2-3-2.8-3.7-2.8-3.7c-2.3-1.6,0.2-1.6,0.2-1.6c2.6,0.2,3.9,2.6,3.9,2.6c2.3,3.9,6,2.8,7.5,2.1 c0.2-1.7,0.9-2.8,1.6-3.4c-5.7-0.6-11.7-2.8-11.7-12.7c0-2.8,1-5.1,2.6-6.9c-0.3-0.7-1.1-3.3,0.3-6.8c0,0,2.1-0.7,7,2.6 c2-0.6,4.2-0.9,6.4-0.9c2.2,0,4.4,0.3,6.4,0.9c4.9-3.3,7-2.6,7-2.6c1.4,3.5,0.5,6.1,0.3,6.8c1.6,1.8,2.6,4.1,2.6,6.9 c0,9.8-6,12-11.7,12.6c0.9,0.8,1.7,2.4,1.7,4.7c0,3.4,0,6.2,0,7c0,0.7,0.5,1.5,1.8,1.2c10.2-3.4,17.5-13,17.5-24.3 C51.5,11.7,40.1,0.2,25.9,0.2z" />
          </svg>
        </mat-icon>
        <span class="mat-text-on-surface-variant">Github</span>
      </a>
    </div>

    <span class="flex flex-row items-baseline flex-wrap md:flex-nowrap">
      <span class="mat-font-title-md mat-text-on-surface-variant">
        {{'toolbar.deposit_calculator' | translate}}
      </span>

      <span class="mat-font-label-md mat-text-disabled"> · 2026</span>
    </span>

    <span class="flex flex-row flex-wrap md:flex-nowrap mat-text-disabled cursor-default select-none">
      <span class="mat-font-body-md">Angular</span>
      <span class="mat-font-label-lg">
        · {{ 'toolbar.version' | translate }} {{ appVersion() }}
      </span>
    </span>
  </div>
</footer>
