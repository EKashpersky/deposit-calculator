<mat-toolbar class="justify-between mat-bg-surface-container-low relative">
  <div class="flex flex-row justify-between mx-auto {{ size() }}">
    <div class="start">
      <span
        class="mat-font-headline-md cursor-pointer select-none mat-text-on-surface"
        routerLink="/"
      >
        {{ 'toolbar.deposit_calculator' | translate }}
      </span>

      <span class="mat-font-label-lg mat-text-disabled">
        {{ 'toolbar.version' | translate }} {{ appVersion() }}
      </span>
    </div>

    <div class="flex flex-row gap-[8px] end">
      <button matButton [matMenuTriggerFor]="currencyMenu">
        <mat-icon class="mat-text-secondary mat-font-label-lg w-auto!">{{ preferredCurrency().symbol }}</mat-icon>
        <span class="mat-text-on-surface-variant">{{ 'toolbar.currency' | translate }}</span>
      </button>

      <mat-menu #currencyMenu="matMenu">
        @for (currency of currencies; track currency) {
          <button
            mat-menu-item
            (click)="changePreferredCurrency(currency)"
          >
            {{ currency.symbol }} {{ 'units.currency.' + currency.code | translate }}
          </button>
        }
      </mat-menu>

      <button matButton [matMenuTriggerFor]="menu">
        <mat-icon class="mat-text-on-surface-variant">translate</mat-icon>
        <span class="mat-text-on-surface-variant">{{ 'toolbar.language' | translate }}</span>
      </button>

      <mat-menu #menu="matMenu">
        @for (language of languages; track language) {
          <button mat-menu-item (click)="selectLanguage(language)">{{ language.name }}</button>
        }
      </mat-menu>

      <button matIconButton (click)="toggleTheme()">
        <mat-icon>{{themeIcon()}}</mat-icon>
      </button>
    </div>

    <!-- Block out of mat-toolbar working zone -->
    <div
      class="right-outside flex absolute top-0 h-full right-0 w-[calc((100%_-_var(--size))_/_2)]"
      [style.--size.px]="sizePx()"
    >
      <!-- Github icon -->
      <div class="flex flex-row items-center relative pl-[8px]">
        <button matButton (click)="openGithub()">
          <mat-icon class="mat-text-on-surface-variant">
            <svg
              class="size-[100%] box-content fill-current"
              xmlns="http://www.w3.org/2000/svg"
              xmlns:xlink="http://www.w3.org/1999/xlink"
              id="Layer_1"
              x="0"
              y="0"
              enable-background="new 0 0 51.8 50.4"
              version="1.1"
              viewBox="0 0 51.8 50.4"
              xml:space="preserve"
            >
              <path  d="M25.9,0.2C11.8,0.2,0.3,11.7,0.3,25.8c0,11.3,7.3,20.9,17.5,24.3c1.3,0.2,1.7-0.6,1.7-1.2c0-0.6,0-2.6,0-4.8 c-7.1,1.5-8.6-3-8.6-3c-1.2-3-2.8-3.7-2.8-3.7c-2.3-1.6,0.2-1.6,0.2-1.6c2.6,0.2,3.9,2.6,3.9,2.6c2.3,3.9,6,2.8,7.5,2.1 c0.2-1.7,0.9-2.8,1.6-3.4c-5.7-0.6-11.7-2.8-11.7-12.7c0-2.8,1-5.1,2.6-6.9c-0.3-0.7-1.1-3.3,0.3-6.8c0,0,2.1-0.7,7,2.6 c2-0.6,4.2-0.9,6.4-0.9c2.2,0,4.4,0.3,6.4,0.9c4.9-3.3,7-2.6,7-2.6c1.4,3.5,0.5,6.1,0.3,6.8c1.6,1.8,2.6,4.1,2.6,6.9 c0,9.8-6,12-11.7,12.6c0.9,0.8,1.7,2.4,1.7,4.7c0,3.4,0,6.2,0,7c0,0.7,0.5,1.5,1.8,1.2c10.2-3.4,17.5-13,17.5-24.3 C51.5,11.7,40.1,0.2,25.9,0.2z" />
            </svg>
          </mat-icon>
          <span class="mat-text-on-surface-variant">Github</span>
        </button>
      </div>
    </div>
  </div>

</mat-toolbar>

<div class="mx-auto pt-[24px] {{ size() }}">
  <router-outlet></router-outlet>
</div>
