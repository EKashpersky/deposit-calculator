<!-- panes -->
<div #panes class="panes grid w-full" [ngClass]="{ 'is-open': pane.opened() }">
  <!-- Dashboard pane -->
  <div class="list-pane flex flex-col gap-4 mat-bg-surface rounded-3xl p-4 self-start">
    <div class="flex flex-row justify-between">
      <h1 class="mat-font-headline-md mat-text-on-surface">
        {{ 'dashboard.deposits' | translate }}
      </h1>

      @if (deposits().length > 0) {
        <button
          matButton="tonal"
          class="flex cursor-pointer select-none"
          (click)="addDeposit($event)"
        >
          <span class="mat-font-label-lg">{{ 'dashboard.add_deposit' | translate }}</span>
          <mat-icon>add2</mat-icon>
        </button>
      }
    </div>

    <div class="card-list flex flex-col transition">
      @if (deposits().length === 0) {
        <span
          class="empty-state mat-font-body-lg mat-text-disabled"
          [innerHTML]="'dashboard.no_deposit' | translate"
          (click)="addDeposit($event)"
        >
        </span>
      }

      @for (deposit of deposits(); track deposit.name()) {
        <deposit-card
          class="mat-card-wrapper pb-5 box-border last-of-type:pb-0"
          animate.leave="fade-out" animate.enter="fade-in"
          [selected]="deposit.name() === selectedDeposit()"
          [deposit]="deposit"
          (editDeposit)="editDeposit($event, deposit)"
          (removeDeposit)="removeDeposit($event, deposit)"
          (click)="openDeposit(deposit.name())"
        ></deposit-card>
      }
    </div>
  </div>

  <!-- deposit pane -->
  <div
    class="deposit-pane mat-bg-surface overflow-hidden min-w-0 rounded-3xl"
  >
    <div class="deposit-frame">
      <router-outlet (activate)="activate()" #outlet="outlet"></router-outlet>
    </div>
  </div>
</div>
